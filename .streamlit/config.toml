# Pebble theme. Light canvas, white cards, one orange accent.
# Card shapes, motion and the Onest font are applied by ais_fmd/ui/theme.py
# (APP_CSS) -- these options only cover what Streamlit's theme exposes.

[theme]
base = "light"
primaryColor = "#D6400E"
backgroundColor = "#F5F5F3"
secondaryBackgroundColor = "#F3F3F0"
textColor = "#111111"
linkColor = "#D6400E"
borderColor = "#ECECE9"
showWidgetBorder = false
baseRadius = "full"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# No Deploy button or ⋮ menu: the profile menu (top right) takes that corner,
# and an operator has no use for Streamlit's developer options.
toolbarMode = "minimal"
